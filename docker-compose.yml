services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4001:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - /home/docker/openterminal/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_URL: http://api:4000
    ports:
      - "3001:3000"
    environment:
      - API_URL=http://api:4000
    depends_on:
      - api
    restart: unless-stopped